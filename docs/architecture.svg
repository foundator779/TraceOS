      <text x="0" y="-28" class="hand white" font-size="29">Operational outcome</text>
      <rect x="0" y="0" width="590" height="220" rx="18" class="box"/>
      <g transform="translate(28 34)">
        <rect x="0" y="0" width="160" height="126" rx="13" class="tag"/><path d="M28 30h52M28 51h76M28 72h62" stroke="#8ab4f8" stroke-width="5" stroke-linecap="round"/><text x="24" y="105" class="ui white" font-size="18" font-weight="700">3D replay</text>
        <rect x="188" y="0" width="160" height="126" rx="13" class="tag"/><path d="M219 25h68v64h-68zM230 41h46M230 56h46M230 71h34" fill="none" stroke="#d7d1b0" stroke-width="4"/><text x="214" y="105" class="ui white" font-size="18" font-weight="700">Report</text>
        <rect x="376" y="0" width="160" height="126" rx="13" class="tag"/><path d="M400 72l20-25 22 10 20-31 40 18" fill="none" stroke="#81c995" stroke-width="5"/><circle cx="420" cy="47" r="5" fill="#81c995"/><circle cx="442" cy="57" r="5" fill="#81c995"/><circle cx="462" cy="26" r="5" fill="#81c995"/><text x="398" y="105" class="ui white" font-size="18" font-weight="700">OTel traces</text>
        <text x="0" y="174" class="ui cream" font-size="15">Source → observation → hypothesis → verified finding</text>
      </g>
    </g>
    <path d="M1692 806c0 66-154 82-389 82" class="line"/>
    <g transform="translate(1350 858)">
