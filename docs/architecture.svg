<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc">
  <title id="title">TraceOS zero-trust evidence architecture</title>
  <desc id="desc">A chalkboard-style left-to-right architecture showing authenticated evidence entering Google Cloud, governed agents observing it, an independent verifier approving findings, and a one-way post-verification training branch.</desc>
  <defs>
    <filter id="chalk" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="boardNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="22" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.15  0 0 0 0 0.14  0 0 0 0 0.13  0 0 0 .22 0"/>
    </filter>
    <marker id="arrow" viewBox="0 0 14 14" refX="11" refY="7" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1l11 6-11 6 3-6z" fill="#f8f7f2"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 14 14" refX="11" refY="7" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1l11 6-11 6 3-6z" fill="#8ab4f8"/>
    </marker>
    <style>
      .chalk { filter:url(#chalk); }
      .hand { font-family:"KH-Inference-TRIAL","Segoe Print","Comic Sans MS",cursive; }
      .ui { font-family:Inter,"Segoe UI",Arial,sans-serif; }
      .white { fill:#f8f7f2; }
      .cream { fill:#d7d1b0; }
      .blue { fill:#8ab4f8; }
      .muted { fill:#b9b7ae; }
      .line { fill:none; stroke:#f8f7f2; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .line-blue { fill:none; stroke:#8ab4f8; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrowBlue); }
      .thin { fill:none; stroke:#f8f7f2; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
      .box { fill:#181716; stroke:#f8f7f2; stroke-width:3; }
      .box-blue { fill:#181716; stroke:#8ab4f8; stroke-width:3; }
      .tag { fill:#242321; stroke:#706d66; stroke-width:2; }
    </style>
  </defs>
  <rect width="2000" height="1200" fill="#11100f"/>
  <rect width="2000" height="1200" filter="url(#boardNoise)" opacity=".48"/>
  <g opacity=".08" stroke="#fff" fill="none">
    <path d="M52 180C420 138 680 205 1090 154S1670 192 1940 140"/>
    <path d="M80 1010c330-60 690 38 940-5s590-62 900 8"/>
    <path d="M230 94c450 22 820-42 1350 6"/>
  </g>
  <g class="chalk">
    <text x="78" y="88" class="hand white" font-size="52" font-weight="700">How TraceOS proves an autonomous finding</text>
    <text x="80" y="132" class="ui cream" font-size="20" letter-spacing="1.5">ZERO-TRUST MULTIMODAL FORENSICS · EVERY CLAIM RETAINS A PATH TO ITS SOURCE</text>
    <g transform="translate(72 228)">
      <text x="0" y="-42" class="hand white" font-size="31">Evidence arrives</text>
      <rect x="0" y="0" width="275" height="410" rx="16" class="box"/>
      <g transform="translate(30 32)">
        <path d="M58 36c5-23 39-27 50-7 23-9 42 7 42 25 0 18-15 28-33 28H55c-20 0-33-11-33-27 0-14 12-25 36-19z" fill="none" stroke="#8ab4f8" stroke-width="7"/>
        <path d="M54 92h90" stroke="#8ab4f8" stroke-width="4" stroke-linecap="round"/>
        <text x="0" y="128" class="ui white" font-size="22" font-weight="700">Cloud Audit Logs</text>
        <text x="0" y="154" class="ui blue" font-size="15">LIVE GOOGLE CLOUD</text>
      </g>
      <path d="M24 201h227" stroke="#5a5751" stroke-width="2"/>
      <g transform="translate(30 229)">
        <rect x="0" y="0" width="72" height="56" rx="7" fill="none" stroke="#d7d1b0" stroke-width="4"/>
        <circle cx="21" cy="18" r="7" fill="#d7d1b0"/><path d="M9 47l18-17 13 11 10-9 14 15" fill="none" stroke="#d7d1b0" stroke-width="4"/>
        <text x="90" y="24" class="ui white" font-size="18" font-weight="700">Image evidence</text><text x="90" y="49" class="ui cream" font-size="13">PNG · JPEG · WEBP</text>
      </g>
      <path d="M24 314h227" stroke="#5a5751" stroke-width="2"/>
      <g transform="translate(30 340)">
        <circle cx="25" cy="22" r="19" fill="none" stroke="#fbbc04" stroke-width="5"/><path d="M52 22h34M69 5v34" stroke="#fbbc04" stroke-width="4"/>
        <text x="94" y="18" class="ui white" font-size="17" font-weight="700">Safe demo inputs</text><text x="94" y="42" class="ui muted" font-size="11">WATERMARKED SYNTHETIC</text>
      </g>
    </g>
    <g transform="translate(404 255)">
      <text x="0" y="-36" class="hand white" font-size="28">Authenticated intake</text>
      <rect x="0" y="0" width="235" height="126" rx="15" class="box-blue"/>
      <circle cx="43" cy="44" r="24" fill="#4285f4"/><path d="M34 44h18M43 35v18" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="80" y="40" class="ui white" font-size="20" font-weight="700">Pub/Sub OIDC</text><text x="80" y="66" class="ui blue" font-size="14">dedupe event IDs</text>
      <path d="M18 91h199" stroke="#514e49" stroke-width="2"/><text x="24" y="113" class="ui cream" font-size="14">Logging sink · signed push</text>
      <rect x="0" y="166" width="235" height="126" rx="15" class="box"/>
      <path d="M25 204h43v47H25zM31 194h31l6 10H25z" fill="none" stroke="#d7d1b0" stroke-width="4"/>
      <text x="82" y="211" class="ui white" font-size="20" font-weight="700">Private GCS</text><text x="82" y="237" class="ui cream" font-size="14">SHA-256 before analysis</text><text x="24" y="274" class="ui muted" font-size="14">versioned · 60-day lifecycle</text>
      <rect x="0" y="332" width="235" height="84" rx="15" fill="#281b1a" stroke="#f28b82" stroke-width="3"/>
      <path d="M25 361l12-18 12 18v15H25z" fill="none" stroke="#f28b82" stroke-width="4"/>
      <text x="65" y="356" class="ui white" font-size="18" font-weight="700">Fail closed</text><text x="65" y="381" class="ui" fill="#f28b82" font-size="14">quarantine unsafe text</text>
    </g>
    <g transform="translate(700 184)">
      <rect x="0" y="0" width="1218" height="620" rx="24" fill="#151413" stroke="#f8f7f2" stroke-width="5" stroke-dasharray="3 8"/>
      <rect x="36" y="-22" width="424" height="48" rx="20" fill="#11100f"/>
      <g transform="translate(53 -11)">
        <path d="M19 25c-8-2-14-8-14-16 0-9 7-16 16-16 6 0 12 4 14 9 3-2 6-3 9-3 10 0 18 8 18 18 0 8-6 15-14 17" fill="none" stroke="#4285f4" stroke-width="6"/>
        <path d="M20-3l8-8M39-5l4-11M55 4l10-6" stroke-linecap="round" stroke-width="5" stroke="#ea4335"/>
        <text x="79" y="19" class="ui white" font-size="22" font-weight="700">TRACEOS ON GOOGLE CLOUD</text>
      </g>
      <text x="42" y="72" class="hand blue" font-size="29">1. Governed execution</text>
      <rect x="42" y="94" width="324" height="188" rx="16" class="box-blue"/>
      <g transform="translate(68 121)">
        <rect x="0" y="0" width="74" height="74" rx="14" fill="#4285f4"/><path d="M20 22h34v30H20zM27 15h20v7M26 60h22" fill="none" stroke="#fff" stroke-width="4"/>
        <text x="94" y="28" class="ui white" font-size="23" font-weight="700">Cloud Run API</text><text x="94" y="57" class="ui blue" font-size="15">scale 0 → 1</text>
        <text x="0" y="113" class="ui cream" font-size="17">FastAPI control plane</text><text x="0" y="140" class="ui muted" font-size="15">API key · rate limit · audit</text>
      </g>
      <rect x="42" y="322" width="324" height="222" rx="16" class="box"/>
      <text x="68" y="360" class="ui white" font-size="22" font-weight="700">State &amp; durable memory</text>
      <g transform="translate(70 386)">
        <ellipse cx="40" cy="13" rx="38" ry="12" fill="none" stroke="#fbbc04" stroke-width="4"/><path d="M2 13v61c0 7 17 13 38 13s38-6 38-13V13M2 43c0 7 17 13 38 13s38-6 38-13" fill="none" stroke="#fbbc04" stroke-width="4"/>
        <text x="103" y="30" class="ui white" font-size="20" font-weight="700">Firestore</text><text x="103" y="56" class="ui cream" font-size="15">case state · idempotency</text><text x="103" y="82" class="ui cream" font-size="15">7-day Memory Bank resume</text>
      </g>
      <text x="410" y="72" class="hand blue" font-size="29">2. Specialist fleet</text>
      <rect x="410" y="94" width="387" height="450" rx="16" class="box-blue"/>
      <g transform="translate(438 121)">
        <circle cx="42" cy="42" r="39" fill="#8ab4f8"/><circle cx="42" cy="32" r="13" fill="#11100f"/><path d="M18 67c4-15 14-22 24-22s20 7 24 22" fill="#11100f"/>
        <text x="100" y="29" class="ui white" font-size="23" font-weight="700">Case Coordinator</text><text x="100" y="58" class="ui blue" font-size="15">Agent Runtime · ADK</text><text x="0" y="108" class="ui cream" font-size="15">delegates through approved identities</text>
      </g>
      <g transform="translate(438 256)" class="ui" font-size="16">
        <rect x="0" y="0" width="145" height="58" rx="12" class="tag"/><text x="18" y="35" class="white">Visual Evidence</text>
        <rect x="164" y="0" width="145" height="58" rx="12" class="tag"/><text x="186" y="35" class="white">Identity</text>
        <rect x="0" y="76" width="145" height="58" rx="12" class="tag"/><text x="27" y="111" class="white">Endpoint</text>
        <rect x="164" y="76" width="145" height="58" rx="12" class="tag"/><text x="191" y="111" class="white">Network</text>
        <rect x="0" y="152" width="145" height="58" rx="12" class="tag"/><text x="31" y="187" class="white">Timeline</text>
        <rect x="164" y="152" width="145" height="58" rx="12" class="tag"/><text x="179" y="187" class="white">Hypothesis</text>
        <rect x="0" y="228" width="309" height="58" rx="12" fill="#252420" stroke="#d7d1b0" stroke-width="2"/><text x="42" y="263" class="cream" font-weight="700">scoped tools · no finding writes</text>
      </g>
      <text x="840" y="72" class="hand blue" font-size="29">3. Verify before trust</text>
      <rect x="840" y="94" width="336" height="450" rx="16" class="box"/>
      <g transform="translate(866 121)">
        <rect x="0" y="0" width="284" height="92" rx="14" fill="#242321" stroke="#fbbc04" stroke-width="3"/>
        <path d="M23 31l15-17 15 17v22H23zM31 40l6 6 11-13" fill="none" stroke="#fbbc04" stroke-width="4"/>
        <text x="72" y="35" class="ui white" font-size="20" font-weight="700">Fleet Integrity</text><text x="72" y="61" class="ui cream" font-size="14">reject IDs · bounded replay</text>
        <rect x="0" y="116" width="284" height="116" rx="14" fill="#d7d1b0"/>
        <path d="M25 153l19 19 36-42" fill="none" stroke="#11100f" stroke-width="7" stroke-linecap="round"/>
        <text x="88" y="156" class="ui" fill="#11100f" font-size="18" font-weight="800">Independent verifier</text><text x="88" y="183" class="ui" fill="#302f2b" font-size="13">only finding-write authority</text><text x="24" y="214" class="ui" fill="#302f2b" font-size="14">observation + audit event → finding</text>
        <rect x="0" y="256" width="284" height="92" rx="14" fill="#281b1a" stroke="#f28b82" stroke-width="3"/>
        <path d="M23 286h38M42 267v38" stroke="#f28b82" stroke-width="4"/><text x="82" y="289" class="ui white" font-size="19" font-weight="700">Policy gateway</text><text x="82" y="315" class="ui" fill="#f28b82" font-size="14">DENY raw · ALLOW verified</text>
        <rect x="0" y="372" width="284" height="51" rx="12" fill="#1b2a20" stroke="#81c995" stroke-width="3"/><text x="29" y="405" class="ui" fill="#81c995" font-size="17" font-weight="700">VERIFIED FINDINGS ONLY</text>
      </g>
    </g>
    <path d="M350 420H392" class="line"/><path d="M644 420H686" class="line"/><path d="M1068 423h26" class="line-blue"/><path d="M1499 423h29" class="line-blue"/>
