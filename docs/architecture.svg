      <rect x="0" y="0" width="568" height="220" rx="18" fill="#171615" stroke="#d7d1b0" stroke-width="3"/>
      <text x="24" y="31" class="ui cream" font-size="14" font-weight="700" letter-spacing="1">POST-VERIFICATION · NEVER EVIDENCE</text>
      <g transform="translate(24 52)">
        <rect x="0" y="0" width="152" height="74" rx="12" class="tag"/><text x="19" y="31" class="ui white" font-size="18" font-weight="700">Gemma</text><text x="19" y="55" class="ui blue" font-size="13">challenge gate</text>
        <path d="M164 37h34" class="line-blue"/>
        <rect x="210" y="0" width="128" height="74" rx="12" class="tag"/><text x="245" y="31" class="ui white" font-size="18" font-weight="700">Veo</text><text x="231" y="55" class="ui cream" font-size="13">reconstruction</text>
        <rect x="352" y="0" width="128" height="74" rx="12" class="tag"/><text x="384" y="31" class="ui white" font-size="18" font-weight="700">Lyria</text><text x="371" y="55" class="ui cream" font-size="13">tabletop audio</text>
        <path d="M0 107h480" stroke="#f28b82" stroke-width="4" stroke-dasharray="9 8"/><text x="28" y="137" class="ui" fill="#f28b82" font-size="15" font-weight="700">NO RETURN PATH TO EVIDENCE OR FINDINGS</text>
      </g>
    </g>
    <path d="M1728 806v38" class="line-blue"/>
    <g transform="translate(76 1114)">
      <circle cx="9" cy="9" r="8" fill="#81c995"/><text x="27" y="15" class="ui white" font-size="16">Live cloud record</text>
      <circle cx="199" cy="9" r="8" fill="#fbbc04"/><text x="217" y="15" class="ui white" font-size="16">Clearly synthetic fixture</text>
      <circle cx="442" cy="9" r="8" fill="#8ab4f8"/><text x="460" y="15" class="ui white" font-size="16">Managed Google Cloud path</text>
      <text x="1240" y="15" class="ui muted" font-size="15">Cloud Run · Firestore · Pub/Sub · GCS · Vertex AI · Agent Runtime</text>
