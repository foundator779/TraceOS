<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TraceOS investigation flow</title>
  <desc id="desc">Evidence moves through authenticated intake, scoped specialist analysis, independent verification, and a verified report. Unsupported claims stop before the finding lane.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11100F"/>
      <stop offset="1" stop-color="#201F1E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#D7D1B0"/>
    </marker>
    <marker id="stopArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#E8847C"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <circle cx="1450" cy="95" r="245" fill="none" stroke="#D7D1B0" stroke-opacity="0.08" stroke-width="54"/>
  <text x="80" y="100" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">From evidence to a defensible finding</text>
  <text x="80" y="150" fill="#D7D1B0" font-family="Arial, Helvetica, sans-serif" font-size="24">Every transition is typed, policy-checked, evidence-linked, and auditable.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="245" width="250" height="310" rx="26" fill="#201F1E" stroke="#D7D1B0" stroke-width="3"/>
    <circle cx="195" cy="320" r="42" fill="#D7D1B0"/>
    <path d="M165 327h60M174 309l21-17 21 17" fill="none" stroke="#11100F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="195" y="400" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">1. Evidence</text>
    <text x="195" y="442" text-anchor="middle" fill="#D7D1B0" font-family="Arial, Helvetica, sans-serif" font-size="20">Cloud audit events</text>
    <text x="195" y="474" text-anchor="middle" fill="#D7D1B0" font-family="Arial, Helvetica, sans-serif" font-size="20">Images + demo fixtures</text>
    <text x="195" y="515" text-anchor="middle" fill="#86D59A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">SHA-256 REGISTERED</text>

    <rect x="385" y="245" width="250" height="310" rx="26" fill="#201F1E" stroke="#D7D1B0" stroke-width="3"/>
    <circle cx="510" cy="320" r="42" fill="#D7D1B0"/>
    <path d="M486 318h48M493 306v34M527 306v34" fill="none" stroke="#11100F" stroke-width="6" stroke-linecap="round"/>
    <text x="510" y="400" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">2. Intake</text>
    <text x="510" y="442" text-anchor="middle" fill="#D7D1B0" font-family="Arial, Helvetica, sans-serif" font-size="20">Authenticate source</text>
    <text x="510" y="474" text-anchor="middle" fill="#D7D1B0" font-family="Arial, Helvetica, sans-serif" font-size="20">Quarantine unsafe text</text>
    <text x="510" y="515" text-anchor="middle" fill="#86D59A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">FAIL CLOSED</text>

    <rect x="700" y="245" width="250" height="310" rx="26" fill="#201F1E" stroke="#D7D1B0" stroke-width="3"/>
    <circle cx="825" cy="320" r="42" fill="#D7D1B0"/>
    <circle cx="810" cy="311" r="8" fill="#11100F"/><circle cx="840" cy="311" r="8" fill="#11100F"/><circle cx="825" cy="338" r="8" fill="#11100F"/>
    <path d="M815 317l7 14M835 317l-7 14" stroke="#11100F" stroke-width="5"/>
    <text x="825" y="400" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">3. Specialists</text>
    <text x="825" y="442" text-anchor="middle" fill="#D7D1B0" font-family="Arial, Helvetica, sans-serif" font-size="20">Observe within scope</text>
    <text x="825" y="474" text-anchor="middle" fill="#D7D1B0" font-family="Arial, Helvetica, sans-serif" font-size="20">Test bounded hypotheses</text>
    <text x="825" y="515" text-anchor="middle" fill="#86D59A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">NO FINDING WRITES</text>

    <rect x="1015" y="245" width="250" height="310" rx="26" fill="#201F1E" stroke="#D7D1B0" stroke-width="3"/>
    <circle cx="1140" cy="320" r="42" fill="#D7D1B0"/>
    <path d="M1118 320l15 16 31-36" fill="none" stroke="#11100F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1140" y="400" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">4. Verify</text>
    <text x="1140" y="442" text-anchor="middle" fill="#D7D1B0" font-family="Arial, Helvetica, sans-serif" font-size="20">Check every evidence ID</text>
    <text x="1140" y="474" text-anchor="middle" fill="#D7D1B0" font-family="Arial, Helvetica, sans-serif" font-size="20">Require independent types</text>
    <text x="1140" y="515" text-anchor="middle" fill="#86D59A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">SOLE WRITE AUTHORITY</text>

    <rect x="1330" y="245" width="200" height="310" rx="26" fill="#D7D1B0" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="1430" cy="320" r="42" fill="#11100F"/>
    <path d="M1407 309h46M1407 323h46M1407 337h30" stroke="#D7D1B0" stroke-width="6" stroke-linecap="round"/>
    <text x="1430" y="400" text-anchor="middle" fill="#11100F" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">5. Outcome</text>
    <text x="1430" y="442" text-anchor="middle" fill="#201F1E" font-family="Arial, Helvetica, sans-serif" font-size="20">Verified report</text>
    <text x="1430" y="474" text-anchor="middle" fill="#201F1E" font-family="Arial, Helvetica, sans-serif" font-size="20">Replay + traces</text>
    <text x="1430" y="515" text-anchor="middle" fill="#11100F" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">DEFENSIBLE OUTPUT</text>
  </g>

  <path d="M320 400H370" stroke="#D7D1B0" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M635 400H685" stroke="#D7D1B0" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M950 400H1000" stroke="#D7D1B0" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1265 400H1315" stroke="#D7D1B0" stroke-width="5" marker-end="url(#arrow)"/>

  <path d="M825 555V655H1110" fill="none" stroke="#E8847C" stroke-width="5" stroke-dasharray="12 12" marker-end="url(#stopArrow)"/>
  <rect x="1110" y="605" width="420" height="105" rx="22" fill="#382423" stroke="#E8847C" stroke-width="3"/>
  <text x="1140" y="650" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Unsupported claim stopped</text>
  <text x="1140" y="685" fill="#E8847C" font-family="Arial, Helvetica, sans-serif" font-size="19">Missing evidence never reaches the report.</text>

  <rect x="70" y="770" width="1460" height="66" rx="20" fill="#161514" stroke="#4A4743"/>
  <circle cx="110" cy="803" r="10" fill="#86D59A"/>
  <text x="135" y="811" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="20">Verified path</text>
  <circle cx="340" cy="803" r="10" fill="#E8847C"/>
  <text x="365" y="811" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="20">Rejected path</text>
  <text x="1490" y="811" text-anchor="end" fill="#D7D1B0" font-family="Arial, Helvetica, sans-serif" font-size="20">Source → Observation → Hypothesis → Verified Finding</text>
</svg>
