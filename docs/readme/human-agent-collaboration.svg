<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Human and agent collaboration in TraceOS</title>
  <desc id="desc">The investigator supplies a goal and evidence, the governed agent fleet performs asynchronous analysis, and the investigator reviews transparent findings and decides the operational response. New evidence can resume the same case.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11100F"/>
      <stop offset="1" stop-color="#201F1E"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#D7D1B0"/></marker>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#82AFFF"/></marker>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg2)"/>
  <text x="80" y="100" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">Autonomous analysis, human operational control</text>
  <text x="80" y="150" fill="#D7D1B0" font-family="Arial, Helvetica, sans-serif" font-size="24">TraceOS performs the heavy investigative work while keeping evidence, uncertainty, and final decisions visible.</text>

  <g filter="url(#shadow2)">
    <rect x="70" y="230" width="360" height="500" rx="30" fill="#D7D1B0"/>
    <circle cx="250" cy="322" r="58" fill="#11100F"/>
    <circle cx="250" cy="302" r="18" fill="#D7D1B0"/>
    <path d="M214 349c8-26 26-38 36-38s28 12 36 38" fill="#D7D1B0"/>
    <text x="250" y="420" text-anchor="middle" fill="#11100F" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Investigator</text>
    <text x="250" y="470" text-anchor="middle" fill="#201F1E" font-family="Arial, Helvetica, sans-serif" font-size="21">Starts or resumes a case</text>
    <text x="250" y="510" text-anchor="middle" fill="#201F1E" font-family="Arial, Helvetica, sans-serif" font-size="21">Adds approved evidence</text>
    <text x="250" y="550" text-anchor="middle" fill="#201F1E" font-family="Arial, Helvetica, sans-serif" font-size="21">Inspects proof and failures</text>
    <text x="250" y="590" text-anchor="middle" fill="#201F1E" font-family="Arial, Helvetica, sans-serif" font-size="21">Chooses the response</text>
    <rect x="120" y="645" width="260" height="54" rx="18" fill="#11100F"/>
    <text x="250" y="680" text-anchor="middle" fill="#D7D1B0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">HUMAN-IN-CONTEXT</text>

    <rect x="580" y="205" width="470" height="550" rx="30" fill="#201F1E" stroke="#82AFFF" stroke-width="3"/>
    <text x="815" y="270" text-anchor="middle" fill="#82AFFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">GOOGLE ADK · MANAGED AGENT RUNTIME</text>
    <text x="815" y="320" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Governed agent fleet</text>
    <rect x="625" y="360" width="180" height="86" rx="18" fill="#161514" stroke="#5F5B55"/>
    <text x="715" y="397" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Coordinator</text>
    <text x="715" y="425" text-anchor="middle" fill="#D7D1B0" font-family="Arial, Helvetica, sans-serif" font-size="17">delegates + checkpoints</text>
    <rect x="825" y="360" width="180" height="86" rx="18" fill="#161514" stroke="#5F5B55"/>
    <text x="915" y="397" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Specialists</text>
    <text x="915" y="425" text-anchor="middle" fill="#D7D1B0" font-family="Arial, Helvetica, sans-serif" font-size="17">observe within scope</text>
    <rect x="625" y="470" width="180" height="86" rx="18" fill="#161514" stroke="#5F5B55"/>
    <text x="715" y="507" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Integrity</text>
    <text x="715" y="535" text-anchor="middle" fill="#D7D1B0" font-family="Arial, Helvetica, sans-serif" font-size="17">rejects bad references</text>
    <rect x="825" y="470" width="180" height="86" rx="18" fill="#D7D1B0"/>
    <text x="915" y="507" text-anchor="middle" fill="#11100F" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Verifier</text>
    <text x="915" y="535" text-anchor="middle" fill="#201F1E" font-family="Arial, Helvetica, sans-serif" font-size="17">approves findings only</text>
    <rect x="625" y="590" width="380" height="105" rx="20" fill="#16251D" stroke="#86D59A" stroke-width="2"/>
    <text x="815" y="631" text-anchor="middle" fill="#86D59A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">ASYNC + RESUMABLE</text>
    <text x="815" y="665" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="19">Durable state, memory, retries, and trace spans</text>

    <rect x="1200" y="230" width="330" height="500" rx="30" fill="#201F1E" stroke="#D7D1B0" stroke-width="3"/>
    <circle cx="1365" cy="322" r="58" fill="#D7D1B0"/>
    <path d="M1335 295h60M1335 318h60M1335 341h42" stroke="#11100F" stroke-width="7" stroke-linecap="round"/>
    <text x="1365" y="420" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Transparent result</text>
    <text x="1365" y="470" text-anchor="middle" fill="#D7D1B0" font-family="Arial, Helvetica, sans-serif" font-size="21">Interactive evidence replay</text>
    <text x="1365" y="510" text-anchor="middle" fill="#D7D1B0" font-family="Arial, Helvetica, sans-serif" font-size="21">Verified report</text>
    <text x="1365" y="550" text-anchor="middle" fill="#D7D1B0" font-family="Arial, Helvetica, sans-serif" font-size="21">Rejected-claim record</text>
    <text x="1365" y="590" text-anchor="middle" fill="#D7D1B0" font-family="Arial, Helvetica, sans-serif" font-size="21">Auditable traces</text>
    <rect x="1240" y="645" width="250" height="54" rx="18" fill="#D7D1B0"/>
    <text x="1365" y="680" text-anchor="middle" fill="#11100F" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">EVIDENCE-LINKED</text>
  </g>

  <path d="M430 370H560" stroke="#D7D1B0" stroke-width="5" marker-end="url(#arrow2)"/>
  <text x="495" y="345" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18">goal + evidence</text>
  <path d="M1050 370H1180" stroke="#D7D1B0" stroke-width="5" marker-end="url(#arrow2)"/>
  <text x="1115" y="345" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18">proof + status</text>
  <path d="M1200 630C1110 805 545 820 390 665" fill="none" stroke="#82AFFF" stroke-width="5" stroke-dasharray="13 11" marker-end="url(#blueArrow)"/>
  <text x="805" y="837" text-anchor="middle" fill="#82AFFF" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Investigator can append new evidence and resume the same case without losing verified state</text>
</svg>
