<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TraceOS incident response use case</title>
  <desc id="desc">A comparison of a fragmented incident response that compounds into major business impact with a TraceOS-supported response that registers evidence, delegates scoped analysis, independently verifies findings, and enables earlier human action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11100F"/><stop offset="1" stop-color="#191816"/></linearGradient>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#EF817B"/></marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#82D7A0"/></marker>
    <style>.t{font-family:Arial,Helvetica,sans-serif;fill:#fff}.muted{fill:#D7D1B0}.red{fill:#EF817B}.green{fill:#82D7A0}.blue{fill:#79A9FF}.h1{font-size:43px;font-weight:800}.h2{font-size:28px;font-weight:800}.h3{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.caps{font-size:14px;font-weight:700;letter-spacing:1.4px}.panel{fill:#201F1E;stroke:#5D5A55;stroke-width:2}.step{fill:#171614;stroke:#4C4944;stroke-width:2}text[x="408"][y="607"],text[x="1192"][y="607"]{font-size:25px}</style>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <text class="t h1" x="64" y="72">One incident. Two possible outcomes.</text>
  <text class="t muted body" x="64" y="111">TraceOS began as internal research after a fragmented response compounded into a multi-million-dollar impact.</text>

  <rect x="56" y="162" width="704" height="536" rx="28" fill="#211A19" stroke="#EF817B" stroke-width="3"/>
  <text class="t red caps" x="92" y="207">WITHOUT A SHARED EVIDENCE CONTROL PLANE</text>
  <text class="t h2" x="92" y="250">The response fragments</text>
  <g>
    <rect class="step" x="92" y="288" width="278" height="104" rx="17"/><circle cx="128" cy="340" r="20" fill="#EF817B"/><text x="128" y="346" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#11100F">1</text><text class="t h3" x="165" y="329">Alert looks routine</text><text class="t muted small" x="165" y="357">Urgency is underestimated</text>
    <rect class="step" x="446" y="288" width="278" height="104" rx="17"/><circle cx="482" cy="340" r="20" fill="#EF817B"/><text x="482" y="346" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#11100F">2</text><text class="t h3" x="519" y="329">Evidence is scattered</text><text class="t muted small" x="519" y="357">Logs, screenshots, handoffs</text>
    <rect class="step" x="92" y="422" width="278" height="104" rx="17"/><circle cx="128" cy="474" r="20" fill="#EF817B"/><text x="128" y="480" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#11100F">3</text><text class="t h3" x="165" y="463">Context gets lost</text><text class="t muted small" x="165" y="491">Teams rebuild the timeline</text>
    <rect class="step" x="446" y="422" width="278" height="104" rx="17"/><circle cx="482" cy="474" r="20" fill="#EF817B"/><text x="482" y="480" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#11100F">4</text><text class="t h3" x="519" y="463">Assumption becomes fact</text><text class="t muted small" x="519" y="491">No independent verification</text>
  </g>
  <path d="M370 340H430" stroke="#EF817B" stroke-width="4" marker-end="url(#redArrow)"/><path d="M585 392V414" stroke="#EF817B" stroke-width="4" marker-end="url(#redArrow)"/><path d="M446 474H386" stroke="#EF817B" stroke-width="4" marker-end="url(#redArrow)"/>
  <rect x="92" y="568" width="632" height="94" rx="18" fill="#3A211F" stroke="#EF817B" stroke-width="2"/><text class="t h2" x="408" y="607" text-anchor="middle">Delayed containment → damage compounds</text><text class="t red body" x="408" y="638" text-anchor="middle">Downtime · recovery · operational disruption · millions in impact</text>

  <rect x="840" y="162" width="704" height="536" rx="28" fill="#18231C" stroke="#82D7A0" stroke-width="3"/>
  <text class="t green caps" x="876" y="207">WITH TRACEOS</text>
  <text class="t h2" x="876" y="250">The response stays evidence-led</text>
  <g>
    <rect class="step" x="876" y="288" width="278" height="104" rx="17"/><circle cx="912" cy="340" r="20" fill="#82D7A0"/><text x="912" y="346" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#11100F">1</text><text class="t h3" x="949" y="329">Evidence registered</text><text class="t muted small" x="949" y="357">Source + time + SHA-256</text>
    <rect class="step" x="1230" y="288" width="278" height="104" rx="17"/><circle cx="1266" cy="340" r="20" fill="#82D7A0"/><text x="1266" y="346" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#11100F">2</text><text class="t h3" x="1303" y="329">Agents observe in scope</text><text class="t muted small" x="1303" y="357">Parallel, bounded analysis</text>
    <rect class="step" x="876" y="422" width="278" height="104" rx="17"/><circle cx="912" cy="474" r="20" fill="#82D7A0"/><text x="912" y="480" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#11100F">3</text><text class="t h3" x="949" y="463">Claims challenged</text><text class="t muted small" x="949" y="491">Missing evidence is rejected</text>
    <rect class="step" x="1230" y="422" width="278" height="104" rx="17"/><circle cx="1266" cy="474" r="20" fill="#82D7A0"/><text x="1266" y="480" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#11100F">4</text><text class="t h3" x="1303" y="456">Finding independently</text><text class="t h3" x="1303" y="480">verified</text><text class="t muted small" x="1303" y="507">Human sees the proof path</text>
  </g>
  <path d="M1154 340H1214" stroke="#82D7A0" stroke-width="4" marker-end="url(#greenArrow)"/><path d="M1369 392V414" stroke="#82D7A0" stroke-width="4" marker-end="url(#greenArrow)"/><path d="M1230 474H1170" stroke="#82D7A0" stroke-width="4" marker-end="url(#greenArrow)"/>
  <rect x="876" y="568" width="632" height="94" rx="18" fill="#153421" stroke="#82D7A0" stroke-width="2"/><text class="t h2" x="1192" y="607" text-anchor="middle">Earlier action → defensible response</text><text class="t green body" x="1192" y="638" text-anchor="middle">Verified report · replayable proof · durable case memory</text>

  <text class="t blue caps" x="64" y="758">PATH TO INTERNAL IMPACT</text>
  <rect class="panel" x="64" y="782" width="300" height="70" rx="16"/><text class="t h3" x="214" y="824" text-anchor="middle">Internal research prototype</text>
  <path d="M364 817H420" stroke="#D7D1B0" stroke-width="4" marker-end="url(#greenArrow)"/>
  <rect class="panel" x="435" y="782" width="300" height="70" rx="16"/><text class="t h3" x="585" y="824" text-anchor="middle">Validate real workflows</text>
  <path d="M735 817H791" stroke="#D7D1B0" stroke-width="4" marker-end="url(#greenArrow)"/>
  <rect class="panel" x="806" y="782" width="300" height="70" rx="16"/><text class="t h3" x="956" y="824" text-anchor="middle">Controlled security pilot</text>
  <path d="M1106 817H1162" stroke="#D7D1B0" stroke-width="4" marker-end="url(#greenArrow)"/>
  <rect x="1177" y="782" width="367" height="70" rx="16" fill="#D7D1B0"/><text x="1360" y="824" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#11100F">Potential governed rollout</text>
</svg>
